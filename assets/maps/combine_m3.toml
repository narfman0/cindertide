briefing_override = "Unit 7-G deviated from its operational parameters during the Pale Ground extraction. It protected a soldier outside its assigned perimeter, then destroyed three allied units, then stopped. It has not moved in six hours. We have since identified eleven other units exhibiting minor deviations — hesitation, target refusal, one instance of what the field report calls 'apparent grief.' This does not leave this briefing. Get to the forge, retrieve 7-G intact if possible, destroy it if not. Shut down the entire production line. We are not ready for whatever this is."
win_override = "7-G is contained. Production line is offline. The research division is asking questions we are not going to answer yet. Command thanks you. Separately — the soldier 7-G protected has requested a transfer to robot unit oversight. Request approved."
loss_override = "7-G is lost. Ironborn have it — or it has them, we're not sure of the distinction anymore. The production line is still running. Something in the forge is keeping it running. We don't know how."
