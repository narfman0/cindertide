briefing_override = "Three weeks we've been running that depot. Our fuel, our hands, our dead keeping the pipes clear. Corp showed up with paperwork this morning. You know what we do with paperwork. Take it back. Hold it. Nobody from the Ironfields surrenders a working refinery to a suit."
win_override = "Depot's ours. Corp pulled back — for now. Word's going to spread that we held. That matters more than the fuel."
loss_override = "They took it. Put their flag on our work. We'll remember this one. The Ironfields remembers everything."

