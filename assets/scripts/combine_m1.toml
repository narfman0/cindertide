[[events]]
id = "briefing"
trigger = { type = "time", seconds = 0.0 }
actions = [
  { type = "dialogue", text = "Commander. The Ironborn Foundry is their staging point for this entire operation. Destroy it and their offensive collapses." },
  { type = "objective", text = "Destroy the Ironborn Foundry" },
]

[[events]]
id = "foundry_patrol"
trigger = { type = "time", seconds = 120.0 }
actions = [
  { type = "spawn_units", faction = "Ironborn", unit_type = "Riflemen", count = 2, x = 100, y = 30 },
  { type = "dialogue", text = "Scouts report a patrol sweeping near the foundry. Watch your flanks as you advance." },
]

[[events]]
id = "counterattack"
trigger = { type = "time", seconds = 300.0 }
actions = [
  { type = "spawn_units", faction = "Ironborn", unit_type = "Riflemen", count = 4, x = 110, y = 20 },
  { type = "spawn_units", faction = "Ironborn", unit_type = "HeavyArmor", count = 1, x = 108, y = 15 },
  { type = "dialogue", text = "They've spotted our advance — counterattack incoming! Maintain pressure on the foundry!" },
]

[[events]]
id = "hero_goes_down"
trigger = { type = "condition", condition = "beat", beat_id = "HeroGoesDown" }
actions = [
  { type = "dialogue", text = "Hold the line! Fall back to defensive positions — we regroup and push again!" },
  { type = "change_objective", text = "Regroup and resume the assault on the Ironborn Foundry" },
]
