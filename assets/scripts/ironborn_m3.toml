actions = [
  { type = "spawn_units", faction = "Combine", unit_type = "Riflemen", count = 2, x = 80, y = 50 },
  { type = "dialogue", speaker = "Foreman", text = "Corp patrol mid-territory. They haven't made us yet — keep the vehicles moving, keep it quiet." },
]

[[events]]
id = "intercept_force"
trigger = { type = "time", seconds = 300.0 }
actions = [
  { type = "spawn_units", faction = "Combine", unit_type = "Riflemen", count = 4, x = 100, y = 40 },
  { type = "spawn_units", faction = "Combine", unit_type = "LightVehicle", count = 2, x = 105, y = 35 },
  { type = "dialogue", speaker = "Foreman", text = "Corp knows what we're moving. Intercept force ahead — four infantry, two vehicles. Break through fast." },
]

[[events]]
id = "extraction_zone_clear"
trigger = { type = "time", seconds = 600.0 }
actions = [
  { type = "dialogue", speaker = "Foreman", text = "Extraction zone is clear ahead. Get the vehicles through. Don't stop." },
  { type = "change_objective", text = "Move all vehicles into the northern extraction zone" },
]
