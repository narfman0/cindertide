[[events]]
id = "get_the_vehicles_across"
trigger = { type = "time", seconds = 0.0 }
actions = [
  { type = "dialogue", speaker = "Foreman", text = "Those three vehicles are the reason we're here. Get them to the northern extraction point. Don't lose a single one." },
  { type = "objective", text = "Extract 3 vehicles to the northern extraction zone" },
]

