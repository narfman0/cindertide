[[events]]
id = "recon_dialogue"
trigger = { type = "time", seconds = 0.0 }
actions = [
  { type = "dialogue", speaker = "Field Comms", text = "Deep Ironborn territory. Establish position before engaging — their installations here are entrenched." },
  { type = "objective", text = "Build a force and assault the Ironborn base" },
]

[[events]]
id = "first_contact"
trigger = { type = "time", seconds = 90.0 }
actions = [
  { type = "spawn_units", faction = "Ironborn", unit_type = "Riflemen", count = 2, x = 80, y = 40 },
  { type = "dialogue", speaker = "Field Comms", text = "Ironborn patrol, mid-field. Two units. Engage or evade — your operational discretion." },
]

[[events]]
id = "second_base_intel"
trigger = { type = "time", seconds = 360.0 }
actions = [
  { type = "dialogue", speaker = "Field Comms", text = "Intelligence has flagged a second Ironborn position, northeast. Reinforced. Plan accordingly." },
]

[[events]]
id = "full_assault"
trigger = { type = "time", seconds = 600.0 }
actions = [
  { type = "spawn_units", faction = "Ironborn", unit_type = "Riflemen", count = 6, x = 110, y = 22 },
  { type = "spawn_units", faction = "Ironborn", unit_type = "HeavyArmor", count = 2, x = 108, y = 15 },
  { type = "dialogue", speaker = "Field Comms", text = "Ironborn committing to full assault on our position. Defensive engagement required." },
]

[[events]]
id = "attack_window"
trigger = { type = "time", seconds = 900.0 }
actions = [
  { type = "dialogue", speaker = "Field Comms", text = "Their assault reduced their base strength. The window is open. Push to the primary target now." },
  { type = "change_objective", text = "Strike the weakened Ironborn base now" },
]
