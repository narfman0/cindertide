[package]
name = "cindertide"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.16", default-features = false, features = [
    "bevy_remote",
    "bevy_asset",
    "bevy_scene",
    "bevy_state",
    "bevy_log",
    "multi_threaded",
    "serialize",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }

[features]
default = []
# Enables 3D rendering (DefaultPlugins, camera, mesh-per-unit). Off by
# default so headless tests stay fast and dependency-light.
render = []

[dev-dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
