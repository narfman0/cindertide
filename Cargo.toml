[package]
name = "cindertide-core"
version = "0.1.0"
edition = "2021"
default-run = "cindertide"

[dependencies]
bevy = { version = "0.16", default-features = false, features = [
    "bevy_remote",
    "bevy_asset",
    "bevy_scene",
    "bevy_state",
    "bevy_log",
    "multi_threaded",
    "serialize",
    "bevy_render",
    "bevy_pbr",
    "bevy_winit",
    "bevy_core_pipeline",
    "bevy_mesh_picking_backend",
    "bevy_ui",
    "bevy_text",
    "bevy_audio",
    "bevy_gltf",
    "vorbis",
    "x11",
    "default_font",
] }
bevy_web_asset = "0.11"
bevy_egui = "0.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["serde", "v4"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
ratatui = "0.29"
crossterm = "0.28"
mlua = { version = "0.10", features = ["lua54", "vendored"] }

[lib]
name = "cindertide"
path = "src/lib.rs"

[[bin]]
name = "cindertide"
path = "src/bin/client.rs"

[[bin]]
name = "cindertide-server"
path = "src/main.rs"

[[bin]]
name = "cindertide-play"
path = "src/bin/play.rs"

[[bin]]
name = "seed_maps"
path = "src/bin/seed_maps.rs"

[features]
default = []
# Enables 3D rendering (DefaultPlugins, camera, mesh-per-unit). Off by
# default so headless tests stay fast and dependency-light.
render = []

[dev-dependencies]
